<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Frequência — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo"><span class="dot"></span> FreqControl</div>
    <div class="nav-right">
      <span class="nav-user" id="nav-user">—</span>
      <button class="btn btn-ghost btn-sm" onclick="Auth.logout()">Sair</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <div class="page-title" id="welcome-msg">Bem-vindo</div>
        <div class="page-subtitle" id="welcome-sub">Gerencie suas turmas e frequência</div>
      </div>
      <button class="btn btn-primary" onclick="openModalTurma()">+ Nova Turma</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Turmas</div>
        <div class="stat-value" id="stat-turmas">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total de Alunos</div>
        <div class="stat-value" id="stat-alunos">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">UCs Ativas</div>
        <div class="stat-value" id="stat-ucs">0</div>
      </div>
    </div>

    <div id="msg-turma" class="msg" style="margin-bottom:1rem;"></div>

    <div id="turmas-grid" class="card-grid">
      <!-- Turmas renderizadas aqui -->
    </div>
  </div>

  <!-- Modal Nova Turma -->
  <div class="modal-overlay" id="modal-turma">
    <div class="modal">
      <div class="modal-title">Nova Turma</div>
      <div id="msg-modal-turma" class="msg"></div>
      <div class="form-group">
        <label>Nome da Turma</label>
        <input type="text" id="input-turma-nome" placeholder="Ex: Turma A — 2025">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModalTurma()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarTurma()">Criar Turma</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/turmas.js"></script>
  <script src="js/alunos.js"></script>
  <script src="js/ucs.js"></script>

  <script>
    const user = Auth.requireLogin();
    if (!user) throw new Error('not logged in');

    document.getElementById('nav-user').textContent = user.email;
    document.getElementById('welcome-msg').textContent = 'Bem-vindo, ' + user.nome.split(' ')[0] + ' 👋';

    function renderTurmas() {
      const turmas = Turmas.getByUser(user.id);
      const grid = document.getElementById('turmas-grid');

      // Stats
      let totalAlunos = 0, totalUCs = 0;
      turmas.forEach(t => {
        totalAlunos += Alunos.getAll(t.id).length;
        totalUCs += UCs.getAll(t.id).length;
      });
      document.getElementById('stat-turmas').textContent = turmas.length;
      document.getElementById('stat-alunos').textContent = totalAlunos;
      document.getElementById('stat-ucs').textContent = totalUCs;

      if (turmas.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="icon">📋</div>
            <p>Nenhuma turma cadastrada ainda.<br>Clique em <strong>+ Nova Turma</strong> para começar.</p>
          </div>`;
        return;
      }

      grid.innerHTML = turmas.map(t => {
        const alunos = Alunos.getAll(t.id).length;
        const ucs = UCs.getAll(t.id).length;
        return `
          <div class="card" style="cursor:default">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
              <div>
                <div style="font-family:var(--font-display);font-weight:700;font-size:1.05rem">${t.nome}</div>
                <div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text3);margin-top:2px">Criada em ${t.criadaEm}</div>
              </div>
              <button class="btn btn-danger btn-sm" onclick="deletarTurma('${t.id}')">✕</button>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1rem;margin-bottom:1rem">
              <span class="badge badge-neutral">${alunos} aluno${alunos !== 1 ? 's' : ''}</span>
              <span class="badge badge-neutral">${ucs} UC${ucs !== 1 ? 's' : ''}</span>
            </div>
            <a href="turma.html?id=${t.id}" class="btn btn-primary btn-sm" style="width:100%;justify-content:center">
              Entrar na Turma →
            </a>
          </div>`;
      }).join('');
    }

    function openModalTurma() {
      document.getElementById('modal-turma').classList.add('open');
      document.getElementById('input-turma-nome').focus();
    }

    function closeModalTurma() {
      document.getElementById('modal-turma').classList.remove('open');
      document.getElementById('input-turma-nome').value = '';
      hideMsg(document.getElementById('msg-modal-turma'));
    }

    function salvarTurma() {
      const nome = document.getElementById('input-turma-nome').value.trim();
      const msg = document.getElementById('msg-modal-turma');
      if (!nome) return showMsg(msg, 'error', 'Informe o nome da turma.');
      Turmas.create(user.id, nome);
      closeModalTurma();
      renderTurmas();
    }

    function deletarTurma(id) {
      if (!confirm('Remover esta turma e todos os seus dados?')) return;
      Turmas.delete(id);
      renderTurmas();
    }

    // Close modal on backdrop click
    document.getElementById('modal-turma').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModalTurma();
    });

    document.getElementById('input-turma-nome').addEventListener('keydown', e => {
      if (e.key === 'Enter') salvarTurma();
    });

    renderTurmas();
  </script>
</body>
</html>
