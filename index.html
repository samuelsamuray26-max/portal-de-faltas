<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Frequência — Acesso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">
        <h1>◈ FreqControl</h1>
        <p>PORTAL DO INSTRUTOR · CONTROLE DE FALTAS</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Entrar</button>
        <button class="auth-tab" onclick="switchTab('cadastro')">Cadastrar</button>
      </div>

      <!-- LOGIN -->
      <div id="form-login" class="auth-form active">
        <div id="msg-login" class="msg"></div>
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">
          Entrar no Portal →
        </button>
      </div>

      <!-- CADASTRO -->
      <div id="form-cadastro" class="auth-form">
        <div id="msg-cad" class="msg"></div>
        <div class="form-group">
          <label for="cad-nome">Nome completo</label>
          <input type="text" id="cad-nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label for="cad-email">E-mail</label>
          <input type="email" id="cad-email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="cad-senha">Senha</label>
          <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doCadastro()">
          Criar conta
        </button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Storage.getSession()) window.location.href = 'portal.html';

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('form-' + tab).classList.add('active');
    }

    function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const msg = document.getElementById('msg-login');

      if (!email || !senha) return showMsg(msg, 'error', 'Preencha todos os campos.');

      const res = Auth.login(email, senha);
      if (!res.ok) return showMsg(msg, 'error', res.msg);

      showMsg(msg, 'success', 'Bem-vindo! Redirecionando…');
      setTimeout(() => window.location.href = 'portal.html', 800);
    }

    function doCadastro() {
      const nome = document.getElementById('cad-nome').value.trim();
      const email = document.getElementById('cad-email').value.trim();
      const senha = document.getElementById('cad-senha').value;
      const msg = document.getElementById('msg-cad');

      if (!nome || !email || !senha) return showMsg(msg, 'error', 'Preencha todos os campos.');
      if (senha.length < 6) return showMsg(msg, 'error', 'Senha deve ter no mínimo 6 caracteres.');

      const res = Auth.register(nome, email, senha);
      if (!res.ok) return showMsg(msg, 'error', res.msg);

      showMsg(msg, 'success', 'Conta criada! Faça login para continuar.');
      setTimeout(() => {
        document.querySelectorAll('.auth-tab')[0].click();
      }, 1200);
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const active = document.querySelector('.auth-form.active');
        if (active.id === 'form-login') doLogin();
        else doCadastro();
      }
    });
  </script>
</body>
</html>
